<label class="field">
  <span class="label">Title</span>
  <input class="input" type="text" [(ngModel)]="title" placeholder="Grid title" />
</label>

<label class="field">
  <span class="label">Rows</span>
  <input class="input" type="number" [(ngModel)]="rows" min="1" max="100" />
</label>

<label class="field">
  <span class="label">Depends On</span>
  <select class="input" [(ngModel)]="dependsOn">
    <option value="">— none —</option>
    @for (frame of availableFrames; track frame) {
      <option [value]="frame">{{ frame }}</option>
    }
  </select>
</label>

<div class="flex flex-col h-screen">
  <header class="flex items-center gap-3 px-6 py-3 shrink-0">
    <span class="brand font-bold text-lg">RW</span>
    <h1 class="font-semibold tracking-wide">WebUI</h1>
    <span class="muted text-sm">RisingWave Stream Viewer</span>
    <div class="ml-auto flex items-center gap-2">
      <span class="status-dot h-2 w-2 rounded-full"></span>
      <span class="muted text-xs">{{ totalRows.toLocaleString() }} rows</span>
    </div>
  </header>

  <div class="flex-1 min-h-0 flex flex-row">
    <main class="flex-1 min-h-0 p-4 flex flex-col gap-2">
      <dynamic-view class="h-48 w-full shrink-0" />
<!--      <rw-grid-->
<!--        class="flex-1 min-h-0 w-full"-->
<!--        url="/rw-webui-api/ws"-->
<!--        action="SEARCH_ALPHA_BETA"-->
<!--        (totalRowsChange)="totalRows = $event"-->
<!--      />-->
    </main>

    <aside class="w-14 shrink-0 py-3 flex flex-col items-center gap-2">
      <p-button icon="pi pi-github" [rounded]="true" size="large" />
      <p-button icon="pi pi-home" [rounded]="true" [text]="true" severity="secondary" />
      <p-button icon="pi pi-comments" [rounded]="true" [text]="true" severity="secondary" />
      <p-button icon="pi pi-inbox" [rounded]="true" [text]="true" severity="secondary" />
      <p-button icon="pi pi-th-large" [rounded]="true" [text]="true" severity="secondary" />
      <p-button icon="pi pi-user" [rounded]="true" [text]="true" severity="secondary" />
      <p-button icon="pi pi-video" [rounded]="true" [text]="true" severity="secondary" />
      <div class="flex-1"></div>
      <p-button icon="pi pi-cog" [rounded]="true" [text]="true" severity="secondary" />
    </aside>
  </div>
</div>

<div class="flex flex-col h-screen bg-gray-950 text-gray-100">
  <header class="flex items-center gap-3 px-6 py-3 bg-gray-900 border-b border-gray-700 shrink-0">
    <span class="text-blue-400 font-bold text-lg">RW</span>
    <h1 class="text-white font-semibold tracking-wide">WebUI</h1>
    <span class="text-gray-500 text-sm">RisingWave Stream Viewer</span>
    <div class="ml-auto flex items-center gap-2">
      <span class="h-2 w-2 rounded-full bg-green-400"></span>
      <span class="text-xs text-gray-400">{{ totalRows.toLocaleString() }} rows</span>
    </div>
  </header>

  <main class="flex-1 min-h-0 p-4">
    <ag-grid-angular
      class="h-full w-full"
      [theme]="theme"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      rowModelType="serverSide"
      [serverSideDatasource]="datasource"
      [cacheBlockSize]="100"
      [pagination]="true"
      [paginationPageSize]="100"
    />
  </main>
</div>

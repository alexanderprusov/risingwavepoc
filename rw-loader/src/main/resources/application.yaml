spring:
  kafka:
    bootstrap-servers: kafka.risingwavepoc-kafka.svc.cluster.local:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

  datasource:
    url: jdbc:postgresql://risingwave:4567/dev
    username: root
    password: ""
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080
  servlet:
    context-path: /rw-loader

app:
  openapi:
    server-url: /rw-loader
  kafka:
    topics:
      entities: entities
      alpha: alpha
      beta: beta
      refs: refs

plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
    id 'com.google.cloud.tools.jib' version "${jibVersion}"
    id 'com.google.protobuf' version "${protobufPluginVersion}"
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
}

def protoSrcDir = "$projectDir/src/main/proto"

task generateDescriptors {
    def protos = ['alpha', 'beta', 'entity', 'ref']
    inputs.files  protos.collect { "$protoSrcDir/${it}.proto" }
    outputs.files protos.collect { "$protoSrcDir/${it}.pb" }
    doLast {
        def protocExe = configurations.detachedConfiguration(
            dependencies.create("com.google.protobuf:protoc:${protobufVersion}:linux-x86_64@exe")
        ).singleFile
        protos.each { name ->
            exec {
                commandLine protocExe.absolutePath,
                    "--proto_path=$protoSrcDir",
                    "--descriptor_set_out=$protoSrcDir/${name}.pb",
                    "${name}.proto"
            }
        }
    }
}

generateProto.dependsOn generateDescriptors

jib {
    from {
        image = jreImage
    }
    to {
        image = 'risingwavepoc/rw-loader:latest'
    }
    dockerClient {
        executable = dockerExecutable
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.liquibase:liquibase-core'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    implementation "org.postgresql:postgresql:${postgresqlVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion.toInteger())
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

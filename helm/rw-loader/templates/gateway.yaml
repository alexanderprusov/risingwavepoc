apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: risingwavepoc-rw-loader
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /rw-loader
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: risingwavepoc-rw-loader
          port: {{ .Values.app.port }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proto-descriptors
  namespace: {{ .Values.namespace }}
binaryData:
  entity.pb: CpEBCgxlbnRpdHkucHJvdG8iVgoGRW50aXR5Eg4KAmlkGAEgASgDUgJpZBISCgR0eXBlGAIgASgJUgR0eXBlEhgKB3BheWxvYWQYAyABKAlSB3BheWxvYWQSDgoCdHMYBCABKAlSAnRzQiEKEmNvbS5hbGV4LnJ3cC5wcm90b0ILRW50aXR5UHJvdG9iBnByb3RvMw==
  alpha.pb: 
  beta.pb: 
  ref.pb: Co0BCglyZWYucHJvdG8iWAoDUmVmEhkKCGFscGhhX2lkGAEgASgDUgdhbHBoYUlkEhcKB2JldGFfaWQYAiABKANSBmJldGFJZBIdCgpjcmVhdGVkX2F0GAMgASgJUgljcmVhdGVkQXRCHgoSY29tLmFsZXgucndwLnByb3RvQghSZWZQcm90b2IGcHJvdG8z
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proto-server
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proto-server
  template:
    metadata:
      labels:
        app: proto-server
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: proto
              mountPath: /usr/share/nginx/html/entity.pb
              subPath: entity.pb
            - name: proto
              mountPath: /usr/share/nginx/html/alpha.pb
              subPath: alpha.pb
            - name: proto
              mountPath: /usr/share/nginx/html/beta.pb
              subPath: beta.pb
            - name: proto
              mountPath: /usr/share/nginx/html/ref.pb
              subPath: ref.pb
      volumes:
        - name: proto
          configMap:
            name: proto-descriptors
---
apiVersion: v1
kind: Service
metadata:
  name: proto-server
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: proto-server
  ports:
    - port: 80
      targetPort: 80

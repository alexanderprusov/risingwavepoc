apiVersion: apps/v1
kind: Deployment
metadata:
  name: risingwavepoc-rw-webui-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risingwavepoc-rw-webui-api
  template:
    metadata:
      labels:
        app: risingwavepoc-rw-webui-api
    spec:
      containers:
        - name: rw-webui-api
          image: {{ .Values.app.image }}
          imagePullPolicy: {{ .Values.app.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.app.port }}

apiVersion: v1
kind: Service
metadata:
  name: risingwavepoc-rw-webui-api
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: risingwavepoc-rw-webui-api
  ports:
    - port: {{ .Values.app.port }}
      targetPort: {{ .Values.app.port }}
      nodePort: {{ .Values.app.nodePort }}

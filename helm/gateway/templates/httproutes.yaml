---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: risingwavepoc-rw-webui-api
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayName }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /rw-webui-api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: risingwavepoc-rw-webui-api
          port: 8082
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: risingwavepoc-rw-webui
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gatewayName }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /rw-webui
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: risingwavepoc-rw-webui
          port: 80

{{- $quorum := list -}}
{{- range $i := until (int .Values.replicas) -}}
{{- $quorum = append $quorum (printf "%d@kafka-%d.kafka.%s.svc.cluster.local:9093" (add1 $i) $i $.Values.namespace) -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: {{ .Values.namespace }}
data:
  init.sh: |
    #!/bin/bash
    set -e
    ORDINAL=${HOSTNAME##*-}
    NODE_ID=$((ORDINAL + 1))
    PORTS=({{ join " " .Values.nodePorts }})
    EXT_PORT=${PORTS[$ORDINAL]}
    {
    echo "process.roles=broker,controller"
    echo "node.id=${NODE_ID}"
    echo "controller.quorum.voters={{ join "," $quorum }}"
    echo "listeners=PLAINTEXT://:9092,CONTROLLER://:9093"
    echo "advertised.listeners=PLAINTEXT://{{ .Values.nodeIP }}:${EXT_PORT}"
    echo "controller.listener.names=CONTROLLER"
    echo "inter.broker.listener.name=PLAINTEXT"
    echo "listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
    echo "log.dirs=/var/lib/kafka/data"
    echo "offsets.topic.replication.factor={{ .Values.replicas }}"
    echo "transaction.state.log.replication.factor={{ .Values.replicas }}"
    echo "transaction.state.log.min.isr=1"
    echo "num.partitions=8"
    echo "auto.create.topics.enable=true"
    } > /generated-config/server.properties
    if [ ! -f /var/lib/kafka/data/meta.properties ]; then
      /opt/kafka/bin/kafka-storage.sh format -t {{ .Values.clusterID }} -c /generated-config/server.properties
    fi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ .Values.namespace }}
spec:
  serviceName: kafka
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      initContainers:
        - name: init
          image: {{ .Values.image }}
          command: [bash, /scripts/init.sh]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: generated-config
              mountPath: /generated-config
            - name: data
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: {{ .Values.image }}
          command:
            - /opt/kafka/bin/kafka-server-start.sh
            - /generated-config/server.properties
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          volumeMounts:
            - name: generated-config
              mountPath: /generated-config
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: scripts
          configMap:
            name: kafka-config
            defaultMode: 0755
        - name: generated-config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage }}
---
# Headless service — required for StatefulSet pod DNS (kafka-0.kafka.kafka.svc.cluster.local)
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
{{- range $i, $port := .Values.nodePorts }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-{{ $i }}-external
  namespace: {{ $.Values.namespace }}
spec:
  type: NodePort
  selector:
    app: kafka
    statefulset.kubernetes.io/pod-name: kafka-{{ $i }}
  ports:
    - name: client
      port: 9092
      targetPort: 9092
      nodePort: {{ $port }}
{{- end }}
